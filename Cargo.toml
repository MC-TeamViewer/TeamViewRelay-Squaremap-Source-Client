[package]
name = "teamviewrelay-squaremap-source-client"
version = "0.1.0"
edition = "2024"
license = "MIT"
build = "build.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
prost = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "rt", "signal", "sync", "time", "test-util"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
uuid = { version = "1.18", features = ["serde", "v5"] }

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3.2"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
