services:
  squaremap-source:
    image: professornuo/team-view-relay-squaremap-source-client:v0.2.0-proto0.6.4
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        protocol: ../TeamViewRelay-Protocol/proto
      args:
        RUST_IMAGE: ${RUST_IMAGE:-rust:1.94.1-bookworm}
    restart: unless-stopped
    command: ["--config", "/config/config.toml"]
    read_only: true
    # The bind-mounted config may be root-owned and mode 0600 on the host.
    # Use only the numeric root UID. The scratch image has no /etc/group,
    # so specifying `0:0` makes Docker try to resolve a group that is absent.
    # Override with TEAMVIEWRELAY_CONTAINER_UID for a readable non-root UID.
    user: "${TEAMVIEWRELAY_CONTAINER_UID:-0}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 0.25
    mem_limit: 64m
    pids_limit: 32
    volumes:
      - ./config.toml:/config/config.toml:ro
      - squaremap-history:/data
    logging:
      driver: local
      options:
        max-size: 1m
        max-file: "2"

volumes:
  squaremap-history:
